<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Order ' + ${order.number})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <nav class="breadcrumbs" aria-label="Breadcrumbs">
        <a th:href="@{/orders}">My orders</a><span class="muted">/</span>
        <span th:text="${order.number}">CM-1001</span>
    </nav>

    <section class="order-head">
        <div>
            <h1 th:text="'Order ' + ${order.number}">Order CM-1001</h1>
            <p class="muted" th:text="'Placed ' + ${order.createdAtText}">Placed</p>
        </div>
        <span th:replace="~{fragments/layout :: status(${order})}"></span>
    </section>

    <th:block th:replace="~{fragments/layout :: flash}"></th:block>

    <div class="cart-layout">
        <section class="cart-lines">
            <div class="state-box">
                <p class="state-text" th:text="${order.state.description}">What is happening with the order</p>
                <div class="state-actions" th:unless="${#lists.isEmpty(order.customerActions)}">
                    <form th:each="a : ${order.customerActions}" method="post"
                          th:action="@{/orders/{n}/{act}(n=${order.number}, act=${#strings.toLowerCase(a.name())})}">
                        <button type="submit" th:text="${a.label}"
                                th:class="${a.name() == 'PAY'} ? 'button' : 'link-button danger'">Action</button>
                    </form>
                </div>
            </div>

            <article class="cart-line" th:each="line : ${order.lines}">
                <div class="cart-line-info">
                    <h2 class="cart-line-title" th:text="${line.title}">Product</h2>
                    <ul class="cart-line-details" th:if="${!#lists.isEmpty(line.details)}">
                        <li th:each="d : ${line.details}" th:text="${d}">Detail</li>
                    </ul>
                    <span class="muted" th:text="${line.formattedUnitPrice} + ' × ' + ${line.quantity}">0 ₸ × 1</span>
                </div>
                <span class="price" th:text="${line.formattedTotal}">0 ₸</span>
            </article>

            <div class="info-grid">
                <section class="info-card">
                    <h2>History</h2>
                    <ol class="timeline">
                        <li th:each="h : ${order.history}">
                            <span th:text="${h.status}">Status</span>
                            <span class="muted" th:text="${h.timeText}">time</span>
                        </li>
                    </ol>
                </section>
                <section class="info-card">
                    <h2>Email notifications</h2>
                    <p class="muted small" th:text="${order.customer.email}">email</p>
                    <ul class="mail-list">
                        <li th:each="n : ${emails}">
                            <span class="muted" th:text="${n.timeText}">time</span>
                            <span th:text="${n.text}">Text</span>
                        </li>
                    </ul>
                </section>
            </div>
        </section>

        <aside class="cart-summary">
            <h2>Total</h2>
            <div class="summary-row">
                <span class="muted">Items</span>
                <span th:text="${order.formattedSubtotal}">0 ₸</span>
            </div>
            <div class="summary-row" th:if="${order.discount > 0}">
                <span class="muted" th:text="'Promo code ' + ${order.promoCode}">Promo code</span>
                <span class="discount" th:text="'− ' + ${order.formattedDiscount}">− 0 ₸</span>
            </div>
            <div class="summary-row">
                <span class="muted" th:text="${order.delivery.label}">Delivery</span>
                <span th:text="${order.formattedDeliveryCost}">0 ₸</span>
            </div>
            <div class="summary-row summary-total">
                <span th:text="${order.paymentId != null} ? 'Paid' : 'To pay'">To pay</span>
                <span th:text="${order.formattedTotal}">0 ₸</span>
            </div>
            <dl class="order-facts">
                <dt>Recipient</dt>
                <dd th:text="${order.customer.name} + ', ' + ${order.customer.phone}">Name</dd>
                <th:block th:if="${!#strings.isEmpty(order.customer.address)}">
                    <dt>Address</dt>
                    <dd th:text="${order.customer.address}">Address</dd>
                </th:block>
                <dt>Payment</dt>
                <dd th:text="${order.paymentId != null} ? 'Paid, payment ' + ${order.paymentId} : ${order.payment.label}">Payment</dd>
            </dl>
        </aside>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
