<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — CoreMart'">CoreMart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="site-header" th:fragment="header">
    <div class="container header-inner">
        <a class="logo" th:href="@{/}" aria-label="CoreMart home">
            <span class="logo-mark" aria-hidden="true"></span>
            <span><span class="logo-core">Core</span>Mart</span>
        </a>
        <nav class="main-nav" aria-label="Main menu">
            <a th:href="@{/catalog}">Catalog</a>
            <a th:href="@{/catalog(category='LAPTOP')}">Laptops</a>
            <a th:href="@{/catalog(category='DESKTOP_PC')}">Desktop PCs</a>
            <a th:href="@{/catalog(category='MONITOR')}">Monitors</a>
            <a th:href="@{/catalog(category='ACCESSORY')}">Accessories</a>
            <a th:href="@{/bundles}">Bundles</a>
            <a th:href="@{/orders}">My orders</a>
            <a class="cart-link" th:href="@{/cart}">Cart
                <span class="cart-count" th:text="${cartCount} ?: 0">0</span></a>
        </nav>
    </div>
</header>

<footer class="site-footer" th:fragment="footer">
    <div class="container footer-inner">
        <span><span class="logo-core">Core</span>Mart — computer hardware store</span>
        <span class="muted">Student project on design patterns ·
            <a th:href="@{/admin}">Staff area</a></span>
    </div>
</footer>

<!-- One-time messages after an action (added to cart, promo code applied, errors). -->
<th:block th:fragment="flash">
    <div class="flash flash-ok" th:if="${message}" th:text="${message}" role="status">Done</div>
    <div class="flash flash-error" th:if="${error}" th:text="${error}" role="alert">Error</div>
</th:block>

<!-- Order status badge; the colour comes from the state code (NEW, PAID, ...). -->
<span th:fragment="status(order)" class="status"
      th:classappend="'status-' + ${#strings.toLowerCase(order.state.code)}"
      th:text="${order.statusName}">Status</span>

<!-- Simple line icons for the product categories, drawn with SVG (no photos). -->
<th:block th:fragment="icon(category)" th:switch="${category.name()}">
    <svg th:case="'LAPTOP'" class="icon" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="10" y="10" width="28" height="19" rx="2"/><path d="M5 35h38l-3 4H8z"/>
    </svg>
    <svg th:case="'DESKTOP_PC'" class="icon" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="15" y="6" width="18" height="36" rx="2"/><circle cx="24" cy="14" r="2"/><path d="M19 22h10M19 27h10"/>
    </svg>
    <svg th:case="'MONITOR'" class="icon" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="6" y="8" width="36" height="23" rx="2"/><path d="M24 31v7M16 40h16"/>
    </svg>
    <svg th:case="*" class="icon" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="15" y="8" width="18" height="32" rx="9"/><path d="M24 8v10"/>
    </svg>
</th:block>

</body>
</html>
