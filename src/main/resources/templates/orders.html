<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My orders')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <section class="hero">
        <h1>My orders</h1>
        <p class="muted" th:text="${#lists.isEmpty(orders)} ? 'No orders yet.' : 'Orders: ' + ${#lists.size(orders)}">
            No orders yet.</p>
    </section>

    <th:block th:replace="~{fragments/layout :: flash}"></th:block>

    <div class="empty-cart" th:if="${#lists.isEmpty(orders)}">
        <p class="muted">Orders placed in this browser will appear here.</p>
        <a class="button" th:href="@{/catalog}">Go to catalog</a>
    </div>

    <div class="cart-lines orders-list" th:unless="${#lists.isEmpty(orders)}">
        <a class="cart-line order-row" th:each="o : ${orders}" th:href="@{/orders/{n}(n=${o.number})}">
            <div class="cart-line-info">
                <h2 class="cart-line-title" th:text="'Order ' + ${o.number}">Order CM-1001</h2>
                <span class="muted" th:text="${o.createdAtText} + ' · items: ' + ${o.itemCount}">date</span>
            </div>
            <div class="cart-line-actions">
                <span th:replace="~{fragments/layout :: status(${o})}"></span>
                <span class="price" th:text="${o.formattedTotal}">0 ₸</span>
            </div>
        </a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
