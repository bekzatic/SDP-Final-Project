<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cart')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <section class="hero">
        <h1>Cart</h1>
        <p class="muted" th:text="${cart.empty} ? 'Nothing here yet.' : 'Items: ' + ${cart.itemCount}">Items: 0</p>
    </section>

    <th:block th:replace="~{fragments/layout :: flash}"></th:block>

    <div class="empty-cart" th:if="${cart.empty}">
        <p class="muted">Add products from the catalog or pick a ready-made bundle.</p>
        <a class="button" th:href="@{/catalog}">Go to catalog</a>
    </div>

    <div class="cart-layout" th:unless="${cart.empty}">
        <section class="cart-lines">
            <article class="cart-line" th:each="line : ${cart.lines}">
                <div class="cart-line-info">
                    <h2 class="cart-line-title" th:text="${line.item.title}">Product</h2>
                    <ul class="cart-line-details" th:if="${!#lists.isEmpty(line.item.details)}">
                        <li th:each="d : ${line.item.details}" th:text="${d}">Detail</li>
                    </ul>
                    <span class="muted" th:text="${line.item.formattedPrice} + ' each'">0 ₸ each</span>
                </div>
                <div class="cart-line-actions">
                    <form th:action="@{/cart/update}" method="post" class="qty-form">
                        <input type="hidden" name="lineId" th:value="${line.id}">
                        <input class="qty-input" type="number" name="quantity" min="1" max="10"
                               th:value="${line.quantity}" aria-label="Quantity">
                        <button type="submit" class="link-button">Update</button>
                    </form>
                    <span class="price" th:text="${line.formattedTotal}">0 ₸</span>
                    <form th:action="@{/cart/remove}" method="post">
                        <input type="hidden" name="lineId" th:value="${line.id}">
                        <button type="submit" class="link-button danger">Remove</button>
                    </form>
                </div>
            </article>

            <form th:action="@{/cart/clear}" method="post">
                <button type="submit" class="link-button danger">Clear cart</button>
            </form>
        </section>

        <aside class="cart-summary">
            <h2>Total</h2>
            <div class="summary-row">
                <span class="muted">Items</span>
                <span th:text="${cart.formattedSubtotal}">0 ₸</span>
            </div>

            <div th:if="${cart.promoCode != null}" class="promo-applied">
                <div class="summary-row">
                    <span class="muted" th:text="'Promo code ' + ${cart.promoCode}">Promo code</span>
                    <span class="discount" th:text="'− ' + ${cart.formattedDiscount}">− 0 ₸</span>
                </div>
                <p class="muted small" th:text="${cart.discountStrategy.description}">Discount</p>
                <form th:action="@{/cart/promo/remove}" method="post">
                    <button type="submit" class="link-button">Remove promo code</button>
                </form>
            </div>

            <form th:if="${cart.promoCode == null}" th:action="@{/cart/promo}" method="post" class="promo-form">
                <input type="text" name="code" placeholder="Promo code" aria-label="Promo code">
                <button type="submit" class="button button-secondary">Apply</button>
            </form>

            <div class="summary-row summary-total">
                <span>To pay</span>
                <span th:text="${cart.formattedTotal}">0 ₸</span>
            </div>
            <a class="button button-wide" th:href="@{/checkout}">Checkout</a>
        </aside>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
