<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${product.fullName})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <th:block th:replace="~{fragments/layout :: flash}"></th:block>

    <nav class="breadcrumbs">
        <a th:href="@{/catalog}">← Back to catalog</a>
        <span class="muted">/</span>
        <a th:href="@{/catalog(category=${product.category.name()})}" th:text="${product.category.displayName}">Category</a>
    </nav>

    <article class="product">
        <div class="product-media" th:classappend="'cat-' + ${#strings.toLowerCase(product.category.name())}">
            <th:block th:replace="~{fragments/layout :: icon(${product.category})}"></th:block>
        </div>

        <div class="product-info">
            <span class="card-category" th:text="${product.category.displayName}">Laptops</span>
            <h1 class="product-title">
                <span class="card-brand" th:text="${product.brand}">Brand</span>
                <span th:text="${product.name}">Model</span>
            </h1>
            <p class="product-description muted" th:if="${!#strings.isEmpty(product.description)}"
               th:text="${product.description}">Description</p>

            <div class="buy-box">
                <span class="price price-large" th:text="${product.formattedPrice}">0 ₸</span>
                <span th:if="${product.stock == 0}" class="badge badge-out">Out of stock</span>
                <span th:if="${product.stock > 0 and product.stock <= lowStock}" class="badge badge-low"
                      th:text="'Low stock: only ' + ${product.stock} + ' left'">Low stock</span>
                <span th:if="${product.stock > lowStock}" class="badge badge-in"
                      th:text="'In stock: ' + ${product.stock} + ' pcs.'">In stock</span>
            </div>

            <form class="add-form" th:action="@{/cart/add}" method="post" th:if="${product.inStock}">
                <input type="hidden" name="productId" th:value="${product.id}">

                <fieldset class="services">
                    <legend>Warranty</legend>
                    <label class="service">
                        <input type="radio" name="addOns" value="" checked>
                        <span>Standard manufacturer warranty</span>
                        <span class="muted">free</span>
                    </label>
                    <label class="service" th:each="t : ${warranties}">
                        <input type="radio" name="addOns" th:value="${t.name()}">
                        <span th:text="${t.label}">Warranty +1 year</span>
                        <span class="muted" th:text="'+ ' + ${addOnPrices.get(t)}">+ 0 ₸</span>
                    </label>
                </fieldset>

                <fieldset class="services" th:if="${!#lists.isEmpty(extras)}">
                    <legend>Services</legend>
                    <label class="service" th:each="t : ${extras}">
                        <input type="checkbox" name="addOns" th:value="${t.name()}">
                        <span th:text="${t.label}">Service</span>
                        <span class="muted" th:text="'+ ' + ${addOnPrices.get(t)}">+ 0 ₸</span>
                    </label>
                </fieldset>

                <div class="add-row">
                    <label for="quantity" class="muted">Quantity</label>
                    <input id="quantity" class="qty-input" type="number" name="quantity" value="1" min="1"
                           th:max="${maxQuantity}">
                    <button class="button" type="submit">Add to cart</button>
                </div>
            </form>

            <h2 class="specs-title">Specifications</h2>
            <table class="specs-table">
                <tr><th>Brand</th><td th:text="${product.brand}">Brand</td></tr>
                <tr><th>Model</th><td th:text="${product.name}">Model</td></tr>
                <tr th:each="s : ${product.specs}">
                    <th th:text="${s.key}">Spec</th>
                    <td th:text="${s.value}">Value</td>
                </tr>
            </table>
        </div>
    </article>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
