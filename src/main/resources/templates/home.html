<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${storeName}">CoreMart</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: "Segoe UI", system-ui, sans-serif; background: #f6f7fb; color: #1b2430; }
        .box { text-align: center; padding: 40px 48px; background: #fff; border-radius: 16px;
               border: 1px solid #e3e7ef; }
        h1 { margin: 0 0 8px; font-size: 32px; }
        h1 span { color: #2f6feb; }
        p { margin: 0; color: #5b6675; }
    </style>
</head>
<body>
<div class="box">
    <h1><span>Core</span>Mart</h1>
    <p>Магазин компьютерной техники скоро откроется.</p>
</div>
</body>
</html>
