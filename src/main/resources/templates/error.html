<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <section class="not-found">
        <div class="not-found-code" th:text="${status} ?: 'Error'">500</div>
        <h1>Something went wrong</h1>
        <p class="muted" th:if="${status == 400}">We could not understand the request: the link or form seems to contain an error.</p>
        <p class="muted" th:if="${status == 404}">This page does not exist. The link may be outdated.</p>
        <p class="muted" th:unless="${status == 400 or status == 404}">Please try again a little later.</p>
        <a class="button" th:href="@{/catalog}">Go to catalog</a>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
